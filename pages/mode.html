<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choisissez votre mode de jeu — Congo-Brazza Quizz</title>
    <link rel="stylesheet" href="../style.css" />
</head>
<body>
    <div class="container">
        <p class="back-link"><a href="../index.html">&larr; Retour</a></p>
        <main>
            <h1>Choisissez votre mode de jeu</h1>
            <div class="mode-list">
                <a class="mode-card" href="categorie.html">
                    <h2>Jouer seul</h2>
                    <p>1 joueur</p>
                </a>
                <div class="mode-card mode-card--disabled" aria-disabled="true">
                    <h2>Jouer à plusieurs</h2>
                    <p>2 à 10 joueurs</p>
                    <span class="mode-card-badge">Bientôt disponible</span>
                </div>
                <div class="mode-card mode-card--disabled" aria-disabled="true">
                    <h2>Jouer en salle</h2>
                    <p>4 à 200 joueurs</p>
                    <span class="mode-card-badge">Bientôt disponible</span>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
