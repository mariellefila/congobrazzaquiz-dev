<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Congo-Brazza Quizz</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="hero-body">
    <div class="hero">
        <div class="hero-video-wrapper" aria-hidden="true">
            <iframe
                id="heroVideo"
                class="hero-video"
                title="Brazzaville"
                frameborder="0"
                allow="autoplay; encrypted-media"
                tabindex="-1"
            ></iframe>
        </div>
        <div class="hero-overlay"></div>

        <header class="hero-nav">
            <nav aria-label="Navigation principale">
                <a href="pages/leaderboard.html">Classement</a>
                <a href="pages/proposer-question.html">Proposer une question</a>
                <a href="pages/proposer-publicite.html">Proposer une pub</a>
            </nav>
            <a
                class="hero-nav-facebook"
                href="https://www.facebook.com/profile.php?id=100063648157074"
                target="_blank"
                rel="noopener"
                aria-label="Congo Brazza Quiz sur Facebook"
            >
                <img src="images/brand/facebook-icon.svg" alt="" width="20" height="20" />
            </a>
        </header>

        <nav class="mobile-nav" aria-label="Navigation mobile">
            <a href="pages/leaderboard.html">
                <img src="rebuild/Classement.svg" alt="" width="22" height="22" />
                <span>Classement</span>
            </a>
            <a href="pages/proposer-question.html">
                <img src="rebuild/Proposer%20une%20questions.svg" alt="" width="22" height="22" />
                <span>Proposer une questions</span>
            </a>
            <a href="pages/proposer-publicite.html">
                <img src="rebuild/Proposer%20une%20pub.svg" alt="" width="22" height="22" />
                <span>Proposer une pub</span>
            </a>
        </nav>

        <main class="hero-main">
            <img class="hero-logo" src="rebuild/LOGO%20CQB.svg" alt="Congo Brazza Quiz" />
            <div class="cta-group">
                <a class="cta-btn is-active" href="pages/categorie.html" aria-pressed="true">Catégorie</a>
                <a class="cta-btn" href="pages/mode.html" aria-pressed="false">Mode</a>
            </div>
        </main>
    </div>
    <script>
        // Construit l'URL de l'embed avec l'origin exact : évite l'erreur YouTube 153
        // (validation d'origine) quand le site est servi depuis un domaine dynamique (tunnel, preview...).
        (function () {
            var ctaButtons = document.querySelectorAll('.cta-btn');

            ctaButtons.forEach(function (button) {
                button.addEventListener('click', function () {
                    ctaButtons.forEach(function (ctaButton) {
                        var isActive = ctaButton === button;
                        ctaButton.classList.toggle('is-active', isActive);
                        ctaButton.setAttribute('aria-pressed', String(isActive));
                    });
                });
            });

            var params = new URLSearchParams({
                autoplay: '1',
                mute: '1',
                loop: '1',
                playlist: '3l0XB0kapdU',
                controls: '0',
                showinfo: '0',
                modestbranding: '1',
                rel: '0',
                playsinline: '1',
                origin: window.location.origin,
            });
            document.getElementById('heroVideo').src =
                'https://www.youtube.com/embed/3l0XB0kapdU?' + params.toString();
        })();
    </script>
</body>
</html>
